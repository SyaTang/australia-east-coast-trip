.1753], "10.04", "捷星直飞~2.5h", "圣灵群岛PPP→悉尼SYD"]], "airports": [["MEL", "墨尔本机场", -37.669, 144.841, "CX135国际抵达 / JQ436内陆出发 / 租车取还"], ["OOL", "黄金海岸机场", -28.1644, 153.5047, "JQ436抵达 / JQ892出发 / 租车取还"], ["CNS", "凯恩斯机场", -16.8858, 145.7553, "JQ892抵达 / 直飞圣灵群岛出发"], ["PPP", "普罗瑟派恩(圣灵群岛)机场", -20.495, 148.552, "圣灵群岛直飞抵达 / 捷星飞悉尼出发 / 接驳车约40分钟到艾尔利滩"], ["SYD", "悉尼机场", -33.9399, 151.1753, "捷星抵达 / CX100国际返程出发"]], "details": {"1": {"intro": "墨尔本市中心地标，黄色维多利亚式百年老站，门前台阶是当地人约定俗成的碰面点。", "trans": "住市中心，步行可达；免费City Circle环城电车经过。", "dur": "约0.5小时"}, "2": {"intro": "墨尔本最著名的街头涂鸦艺术巷，墙面作品不断被覆盖更新，每次来都不一样。", "trans": "步行，紧邻弗林德斯街车站与联邦广场。", "dur": "约0.5小时"}, "3": {"intro": "解构主义风格建筑群，集美术馆、影院、餐厅于一体的文化广场，常有街头表演。", "trans": "步行，位于弗林德斯街车站正对面。", "dur": "0.5–1小时"}, "4": {"intro": "穿城而过的亚拉河两岸步道，河畔咖啡、天鹅与城市夜景，散步休闲好去处。", "trans": "步行，沿市中心河段。", "dur": "0.5–1小时"}, "5": {"intro": "大洋路起点附近的白色海崖灯塔，可俯瞰巴斯海峡海岸线。", "trans": "自驾，市区往北约1小时（MEL机场取车）。", "dur": "约0.5小时"}, "6": {"intro": "大洋路标志性木质门牌拱门，纪念一战返乡士兵修筑这条路。", "trans": "自驾途经，路边停车拍照。", "dur": "约15分钟"}, "7": {"intro": "大洋路沿线的海滨度假小镇，沙滩、瀑布步道与咖啡馆。", "trans": "自驾停靠。", "dur": "0.5–1小时"}, "8": {"intro": "宁静的海湾小镇，通常作为大洋路行程的午餐与休息站。", "trans": "自驾停靠。", "dur": "约1小时（含午餐）"}, "9": {"intro": "从海崖顶沿台阶下到沙滩，可从下方近距离仰望十二使徒岩。", "trans": "自驾停靠，停车场旁即是台阶入口。", "dur": "约0.5小时"}, "10": {"intro": "大洋路精华，矗立海中的石灰岩海蚀柱群，日落时分最震撼，本次行程心愿点。", "trans": "自驾前往；可选直升机俯瞰。", "dur": "1–1.5小时"}, "11": {"intro": "丹德农山脉的百年蒸汽小火车，穿越雨林，可坐在窗边把腿悬空，经典体验。", "trans": "自驾约1小时，或从墨尔本市区参加半日/一日游。", "dur": "3–4小时（含往返）"}, "12": {"intro": "菲利普岛上的动物园，可抱考拉、喂袋鼠，人少亲近动物。", "trans": "自驾约1.5小时，前往菲利普岛途中。", "dur": "1.5–2小时"}, "13": {"intro": "海崖观景栈道，可远眺海豹岩与企鹅栖息地，海景开阔。", "trans": "自驾，菲利普岛西南端。", "dur": "约1小时"}, "14": {"intro": "傍晚神仙企鹅列队从海里归巢，需提前预订看台票，禁止拍照。", "trans": "自驾，菲利普岛；归巢在日落后。", "dur": "2–2.5小时（含等候）"}, "15": {"intro": "澳洲经典野生动物园，可抱考拉、喂袋鼠、看彩虹鹦鹉喂食秀。", "trans": "自驾约20分钟（OOL机场取车）。", "dur": "3–4小时"}, "16": {"intro": "悬崖海景与冲浪海滩，海边国家公园步道可俯瞰海岸线。", "trans": "自驾约25分钟。", "dur": "1–2小时"}, "17": {"intro": "南半球最高住宅楼的观景台，日落时俯瞰整条黄金海岸海岸线。", "trans": "自驾或步行至冲浪者天堂Q1大楼。", "dur": "1–1.5小时"}, "18": {"intro": "黄金海岸标志性海滩与市中心，摩天楼林立、沙滩绵延。", "trans": "酒店步行可达。", "dur": "1–2小时"}, "19": {"intro": "内陆雨林小镇，有酒庄、雨林瀑布步道与手工艺品集市。", "trans": "自驾约40分钟。", "dur": "3–4小时"}, "20": {"intro": "文艺休闲街区，餐厅、精品店与轻轨相连，节奏悠闲。", "trans": "自驾或乘G:link轻轨。", "dur": "1–2小时"}, "21": {"intro": "主题乐园（可选），海豚海狮表演、游乐设施与水上项目。", "trans": "自驾约25分钟。", "dur": "全天或4–6小时"}, "22": {"intro": "凯恩斯市区海滨的免费公共泻湖泳池与步道，适合泡水解暑。", "trans": "酒店步行可达。", "dur": "1–2小时"}, "23": {"intro": "全天出海到外礁浮动平台浮潜，看珊瑚与热带鱼群，本次行程心愿点。", "trans": "凯恩斯码头参加出海一日游（含船程与装备）。", "dur": "全天（约8–9小时）"}, "24": {"intro": "从艾尔利滩出海的日落帆船巡游，含饮品，海上看晚霞。", "trans": "艾尔利滩码头登船。", "dur": "2–3小时"}, "25": {"intro": "含98%纯白硅砂的白天堂沙滩，沙洲随潮汐变幻，视频里的经典画面。", "trans": "从艾尔利滩乘快艇/游船一日游前往。", "dur": "全天或半日游"}, "26": {"intro": "俯瞰希尔湾沙洲漩涡状潮汐奇观的最佳观景台。", "trans": "与白天堂沙滩同一船程，下船后步行登山步道约15分钟。", "dur": "含在白天堂一日游内"}, "27": {"intro": "悉尼市中心的绿地公园，有喷泉、林荫道与战争纪念碑。", "trans": "步行，或火车至St James站。", "dur": "约0.5小时"}, "28": {"intro": "哥特复兴式砂岩大教堂，彩窗精美，免费入内参观。", "trans": "步行，海德公园旁。", "dur": "0.5–1小时"}, "29": {"intro": "悉尼渡轮枢纽，可同时远眺歌剧院与海港大桥。", "trans": "步行，或火车至Circular Quay站。", "dur": "0.5–1小时"}, "30": {"intro": "帆船造型的世界文化遗产，可入内参加中文导览，本次行程心愿点。", "trans": "步行，环形码头旁。", "dur": "1–1.5小时（含导览）"}, "31": {"intro": "悉尼海港大桥，可登桥塔瞭望台或参加攀桥，俯瞰全港。", "trans": "步行，环形码头/岩石区一侧。", "dur": "1–2小时（登桥）"}, "32": {"intro": "5–11月座头鲸迁徙季出海观鲸，运气好可近距离看到鲸鱼。", "trans": "环形码头或达令港登船。", "dur": "3–4小时"}, "33": {"intro": "海港边的皇家植物园，绿地、雕塑与海港景观，适合野餐散步。", "trans": "步行，歌剧院旁。", "dur": "约1小时"}, "34": {"intro": "拍摄歌剧院与海港大桥同框的经典机位，位于植物园内海角。", "trans": "步行，皇家植物园内。", "dur": "约0.5小时"}, "35": {"intro": "世界最陡的景观铁路、空中缆车与雨林步道，蓝山一日精华。", "trans": "火车至Katoomba约2小时，或从悉尼参加一日游。", "dur": "景区内3–4小时（含往返全天）"}, "36": {"intro": "蓝山三座并列的砂岩奇峰，回声角观景台是最佳拍摄点。", "trans": "与Scenic World同景区，蓝山一日行程内。", "dur": "0.5–1小时"}, "37": {"intro": "悉尼最古老的历史街区，鹅卵石巷弄、酒吧与周末市集。", "trans": "步行，环形码头旁。", "dur": "1–2小时"}, "38": {"intro": "免费入场的当代艺术馆，顶楼咖啡馆可俯瞰海港。", "trans": "步行，环形码头旁。", "dur": "1–2小时"}, "39": {"intro": "港湾旁的动物园，乘缆车上山看考拉，背景就是歌剧院与海港。", "trans": "环形码头乘渡轮约12分钟直达。", "dur": "3–4小时（含渡轮）"}, "40": {"intro": "滨水娱乐区，餐厅、海事博物馆与夜景，周末偶有烟花。", "trans": "步行或乘轻轨前往。", "dur": "1–2小时（傍晚）"}}};
const CC = DATA.city_color;
const map = L.map('map',{zoomControl:true,preferCanvas:false}).setView([-27.5,146],5);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:18, attribution:'底图 © Esri World Street Map'}).addTo(map);

const layers = {};
const markers = {};
Object.keys(CC).forEach(c=>{ layers[c]=L.layerGroup().addTo(map); });
const hotelLayer = L.layerGroup().addTo(map);
const airportLayer = L.layerGroup().addTo(map);
const flightLayer = L.layerGroup().addTo(map);

// flights (airport-to-airport dashed lines + label)
DATA.flights.forEach(f=>{
  const [a,b]=f; const col='#0f2c4c';
  flightLayer.addLayer(L.polyline([a,b],{color:col,weight:2,dashArray:'6,7',opacity:.75}));
  const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  flightLayer.addLayer(L.marker(mid,{icon:L.divIcon({className:'',html:`<div class="plabel">✈ ${f[2]} ${f[3]}</div>`,iconSize:[130,18],iconAnchor:[65,9]}),interactive:false}));
});

// attractions
DATA.attractions.forEach(p=>{
  const [num,day,city,cn,en,lat,lng,note]=p; const col=CC[city];
  const dt=DATA.details[num]||{};
  const ic=L.divIcon({className:'',html:`<div class="pin" style="background:${col};width:24px;height:24px;">${num}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
  const m=L.marker([lat,lng],{icon:ic});
  const rows=(dt.intro||dt.trans||dt.dur)?`<div class="rows">`+
      (dt.intro?`<div class="row"><span class="k i">介绍</span><span class="v">${dt.intro}</span></div>`:'')+
      (dt.trans?`<div class="row"><span class="k t">交通</span><span class="v">${dt.trans}</span></div>`:'')+
      (dt.dur?`<div class="row"><span class="k du">时长</span><span class="v">${dt.dur}</span></div>`:'')+
    `</div>`:`<div class="n">${note||''}</div>`;
  m.bindPopup(`<div class="pop"><span class="d">${day} · ${city}</span><br><b>${num}. ${cn}</b><div class="e">${en}</div>${rows}</div>`,{maxWidth:300,autoPan:true,autoPanPadding:[20,20]});
  layers[city].addLayer(m); markers[num]=m;
});

// hotels
DATA.hotels.forEach(h=>{
  const [hid,city,name,nights,date,lat,lng]=h; const col=CC[city];
  const ic=L.divIcon({className:'',html:`<div class="hpin" style="border-color:${col};width:26px;height:22px;">宿</div>`,iconSize:[26,22],iconAnchor:[13,11]});
  const m=L.marker([lat,lng],{icon:ic});
  m.bindPopup(`<div class="pop"><span class="d">${hid} · ${city} 住宿</span><br><b>${name}</b><div class="n">${nights} ｜ ${date}</div></div>`);
  hotelLayer.addLayer(m);
});

// airports
DATA.airports.forEach(ap=>{
  const [code,name,lat,lng,note]=ap;
  const ic=L.divIcon({className:'',html:`<div class="apin" style="height:20px;">✈ ${code}</div>`,iconSize:[58,20],iconAnchor:[29,10]});
  const m=L.marker([lat,lng],{icon:ic});
  m.bindPopup(`<div class="pop"><span class="d">机场 · ${code}</span><br><b>${name}</b><div class="n">${note||''}</div></div>`);
  airportLayer.addLayer(m);
});

map.fitBounds(L.latLngBounds(DATA.attractions.map(p=>[p[5],p[6]]).concat(DATA.hotels.map(h=>[h[5],h[6]]).concat(DATA.airports.map(a=>[a[2],a[3]])))).pad(0.12));

// controls
const ctrl=document.getElementById('ctrl');
function chip(label,color,onclick){
  const d=document.createElement('div'); d.className='chip';
  d.innerHTML=`<span class="dot" style="background:${color}"></span>${label}`;
  let on=true; d.onclick=()=>{on=!on;d.classList.toggle('off',!on);onclick(on);}; ctrl.appendChild(d);
}
Object.keys(CC).forEach(c=>chip(c+'('+DATA.attractions.filter(a=>a[2]===c).length+')',CC[c],on=>{on?map.addLayer(layers[c]):map.removeLayer(layers[c]);}));
chip('住宿','#111827',on=>{on?map.addLayer(hotelLayer):map.removeLayer(hotelLayer);});
chip('机场','#145da0',on=>{on?map.addLayer(airportLayer):map.removeLayer(airportLayer);});
chip('航线','#0f2c4c',on=>{on?map.addLayer(flightLayer):map.removeLayer(flightLayer);});

// legend
const leg=document.getElementById('legend');
function jumpTo(lat,lng,num){ return ()=>{ map.flyTo([lat,lng],Math.max(map.getZoom(),12),{duration:.8}); if(num&&markers[num])setTimeout(()=>markers[num].openPopup(),850);} }
const order=["墨尔本","黄金海岸","凯恩斯","圣灵群岛","悉尼"];
order.forEach(city=>{
  const items=DATA.attractions.filter(a=>a[2]===city);
  const g=document.createElement('div'); g.className='grp'; g.style.background=CC[city];
  g.innerHTML=`<span>${city}</span><small>${items.length}个景点</small>`; leg.appendChild(g);
  items.forEach(a=>{
    const [num,day,c,cn,en,lat,lng]=a;
    const it=document.createElement('div'); it.className='item';
    it.innerHTML=`<div class="num" style="background:${CC[c]}">${num}</div><div><div class="nm">${cn} <span style="color:#9aa">${day}</span></div><div class="en">${en}</div></div>`;
    it.onclick=jumpTo(lat,lng,num); leg.appendChild(it);
  });
  DATA.hotels.filter(h=>h[1]===city).forEach(h=>{
    const it=document.createElement('div'); it.className='hotel';
    it.innerHTML=`<div class="hbadge">宿</div><div><div class="nm">${h[2]}</div><div class="en">${h[3]} ｜ ${h[4]}</div></div>`;
    it.onclick=jumpTo(h[5],h[6],null); leg.appendChild(it);
  });
  DATA.airports.filter(a=>a[1].indexOf(city)===0 || (city==='圣灵群岛'&&a[0]==='PPP')).forEach(ap=>{
    const it=document.createElement('div'); it.className='aport';
    it.innerHTML=`<div class="apin" style="height:20px;flex:0 0 auto;">✈ ${ap[0]}</div><div><div class="nm">${ap[1]}</div><div class="en">${ap[4]}</div></div>`;
    it.onclick=jumpTo(ap[2],ap[3],null); leg.appendChild(it);
  });
});
const fs=document.createElement('div'); fs.className='sect'; fs.textContent='内陆航班(4段)'; leg.appendChild(fs);
DATA.flights.forEach(f=>{const d=document.createElement('div');d.className='fl';d.innerHTML=`<b>${f[4]}</b><br>${f[2]} · ${f[3]}`;leg.appendChild(d);});
</script>
</body></html>
