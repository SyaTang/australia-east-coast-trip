"img/17_1.jpg", "img/17_2.jpg"], "18": ["img/18_1.jpg", "img/18_2.jpg"], "19": ["img/19_1.jpg", "img/19_2.jpg"], "20": ["img/20_1.jpg", "img/20_2.jpg"], "21": ["img/21_1.jpg", "img/21_2.jpg"], "22": ["img/22_1.jpg", "img/22_2.jpg"], "23": ["img/23_1.jpg", "img/23_2.jpg"], "24": ["img/24_1.jpg", "img/24_2.jpg"], "25": ["img/25_1.jpg", "img/25_2.jpg"], "26": ["img/26_1.jpg", "img/26_2.jpg"], "27": ["img/27_1.jpg", "img/27_2.jpg"], "28": ["img/28_1.jpg", "img/28_2.jpg"], "29": ["img/29_1.jpg", "img/29_2.jpg"], "30": ["img/30_1.jpg", "img/30_2.jpg"], "31": ["img/31_1.jpg", "img/31_2.jpg"], "32": ["img/32_1.jpg", "img/32_2.jpg"], "33": ["img/33_1.jpg", "img/33_2.jpg"], "34": ["img/34_1.jpg", "img/34_2.jpg"], "35": ["img/35_1.jpg", "img/35_2.jpg"], "36": ["img/36_1.jpg", "img/36_2.jpg"], "37": ["img/37_1.jpg", "img/37_2.jpg"], "38": ["img/38_1.jpg", "img/38_2.jpg"], "39": ["img/39_1.jpg", "img/39_2.jpg"], "40": ["img/40_1.jpg", "img/40_2.jpg"], "41": ["img/41_1.jpg", "img/41_2.jpg"], "42": ["img/42_1.jpg", "img/42_2.jpg"], "43": ["img/43_1.jpg", "img/43_2.jpg"]}};
const CC = DATA.city_color;
const map = L.map('map',{zoomControl:true,preferCanvas:false}).setView([-27.5,146],5);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:18, attribution:'底图 © Esri World Street Map'}).addTo(map);

const layers = {};
const markers = {};
Object.keys(CC).forEach(c=>{ layers[c]=L.layerGroup().addTo(map); });
const hotelLayer = L.layerGroup().addTo(map);
const airportLayer = L.layerGroup().addTo(map);
const flightLayer = L.layerGroup().addTo(map);

// flights (airport-to-airport dashed lines + label)
DATA.flights.forEach(f=>{
  const [a,b]=f; const col='#0f2c4c';
  flightLayer.addLayer(L.polyline([a,b],{color:col,weight:2,dashArray:'6,7',opacity:.75}));
  const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  flightLayer.addLayer(L.marker(mid,{icon:L.divIcon({className:'',html:`<div class="plabel">✈ ${f[2]} ${f[3]}</div>`,iconSize:[130,18],iconAnchor:[65,9]}),interactive:false}));
});

// attractions
const RATE_LABEL={1:"路过可看",2:"一般",3:"值得一去",4:"推荐",5:"强烈推荐"};
function stars(r){ let s=''; for(let i=1;i<=5;i++) s+=`<span class="${i<=r?'on':'off'}">${i<=r?'★':'☆'}</span>`; return `<span class="stars">${s}<span class="rl">${RATE_LABEL[r]||''}</span></span>`; }
DATA.attractions.forEach(p=>{
  const [num,day,city,cn,en,lat,lng,note]=p; const col=CC[city];
  const dt=DATA.details[num]||{};
  const ph=(DATA.photos&&DATA.photos[num])||[];
  const ic=L.divIcon({className:'',html:`<div class="pin" style="background:${col};width:24px;height:24px;">${num}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
  const m=L.marker([lat,lng],{icon:ic});
  let body='';
  if(dt.intro||dt.trans||dt.dur){
    const distTxt = dt.dist? `距上一景点 ${dt.dist}` : '行程首站';
    body=`<div class="rows">`+
      (dt.intro?`<div class="row"><span class="k i">介绍</span><span class="v">${dt.intro}</span></div>`:'')+
      (dt.rate?`<div class="row"><span class="k r">推荐</span><span class="v">${stars(dt.rate)}</span></div>`:'')+
      (dt.mode?`<div class="row"><span class="k t">交通</span><span class="v"><b>${dt.mode}</b>｜${distTxt}｜${dt.ttime||''}<span class="mut">${dt.trans||''}</span></span></div>`:'')+
      (dt.dur?`<div class="row"><span class="k du">游玩时长</span><span class="v">${dt.dur}</span></div>`:'')+
    `</div>`;
    if(ph.length){
      body+=`<div class="phs">`+ph.slice(0,4).map(u=>`<a href="${u}" target="_blank" rel="noopener"><img loading="lazy" src="${u}" alt="${cn}"></a>`).join('')+`</div>`;
    }
  } else {
    body=`<div class="n">${note||''}</div>`;
  }
  m.bindPopup(`<div class="pop"><span class="d">${day} · ${city}</span><br><b>${num}. ${cn}</b><div class="e">${en}</div>${body}</div>`,{maxWidth:320,autoPan:true,autoPanPadding:[20,20]});
  layers[city].addLayer(m); markers[num]=m;
});

// hotels
DATA.hotels.forEach(h=>{
  const [hid,city,name,nights,date,lat,lng]=h; const col=CC[city];
  const ic=L.divIcon({className:'',html:`<div class="hpin" style="border-color:${col};width:26px;height:22px;">宿</div>`,iconSize:[26,22],iconAnchor:[13,11]});
  const m=L.marker([lat,lng],{icon:ic});
  m.bindPopup(`<div class="pop"><span class="d">${hid} · ${city} 住宿</span><br><b>${name}</b><div class="n">${nights} ｜ ${date}</div></div>`);
  hotelLayer.addLayer(m);
});

// airports
DATA.airports.forEach(ap=>{
  const [code,name,lat,lng,note]=ap;
  const ic=L.divIcon({className:'',html:`<div class="apin" style="height:20px;">✈ ${code}</div>`,iconSize:[58,20],iconAnchor:[29,10]});
  const m=L.marker([lat,lng],{icon:ic});
  m.bindPopup(`<div class="pop"><span class="d">机场 · ${code}</span><br><b>${name}</b><div class="n">${note||''}</div></div>`);
  airportLayer.addLayer(m);
});

map.fitBounds(L.latLngBounds(DATA.attractions.map(p=>[p[5],p[6]]).concat(DATA.hotels.map(h=>[h[5],h[6]]).concat(DATA.airports.map(a=>[a[2],a[3]])))).pad(0.12));

// controls
const ctrl=document.getElementById('ctrl');
function chip(label,color,onclick){
  const d=document.createElement('div'); d.className='chip';
  d.innerHTML=`<span class="dot" style="background:${color}"></span>${label}`;
  let on=true; d.onclick=()=>{on=!on;d.classList.toggle('off',!on);onclick(on);}; ctrl.appendChild(d);
}
Object.keys(CC).forEach(c=>chip(c+'('+DATA.attractions.filter(a=>a[2]===c).length+')',CC[c],on=>{on?map.addLayer(layers[c]):map.removeLayer(layers[c]);}));
chip('住宿','#111827',on=>{on?map.addLayer(hotelLayer):map.removeLayer(hotelLayer);});
chip('机场','#145da0',on=>{on?map.addLayer(airportLayer):map.removeLayer(airportLayer);});
chip('航线','#0f2c4c',on=>{on?map.addLayer(flightLayer):map.removeLayer(flightLayer);});

// legend
const leg=document.getElementById('legend');
function jumpTo(lat,lng,num){ return ()=>{ map.flyTo([lat,lng],Math.max(map.getZoom(),12),{duration:.8}); if(num&&markers[num])setTimeout(()=>markers[num].openPopup(),850);} }
const order=["墨尔本","大洋路","黄金海岸","麦凯","圣灵群岛","悉尼"];
order.forEach(city=>{
  const items=DATA.attractions.filter(a=>a[2]===city);
  const g=document.createElement('div'); g.className='grp'; g.style.background=CC[city];
  g.innerHTML=`<span>${city}</span><small>${items.length}个景点</small>`; leg.appendChild(g);
  items.forEach(a=>{
    const [num,day,c,cn,en,lat,lng]=a;
    const it=document.createElement('div'); it.className='item';
    it.innerHTML=`<div class="num" style="background:${CC[c]}">${num}</div><div><div class="nm">${cn} <span style="color:#9aa">${day}</span></div><div class="en">${en}</div></div>`;
    it.onclick=jumpTo(lat,lng,num); leg.appendChild(it);
  });
  DATA.hotels.filter(h=>h[1]===city).forEach(h=>{
    const it=document.createElement('div'); it.className='hotel';
    it.innerHTML=`<div class="hbadge">宿</div><div><div class="nm">${h[2]}</div><div class="en">${h[3]} ｜ ${h[4]}</div></div>`;
    it.onclick=jumpTo(h[5],h[6],null); leg.appendChild(it);
  });
  DATA.airports.filter(a=>a[1].indexOf(city)===0).forEach(ap=>{
    const it=document.createElement('div'); it.className='aport';
    it.innerHTML=`<div class="apin" style="height:20px;flex:0 0 auto;">✈ ${ap[0]}</div><div><div class="nm">${ap[1]}</div><div class="en">${ap[4]}</div></div>`;
    it.onclick=jumpTo(ap[2],ap[3],null); leg.appendChild(it);
  });
});
const fs=document.createElement('div'); fs.className='sect'; fs.textContent='内陆航班(3段)'; leg.appendChild(fs);
DATA.flights.forEach(f=>{const d=document.createElement('div');d.className='fl';d.innerHTML=`<b>${f[4]}</b><br>${f[2]} · ${f[3]}`;leg.appendChild(d);});
</script>
</body></html>
